<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

, "secondary": "#4a5d91", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-tablet": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "margin": "1rem", "space-sm": "0.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem", "space-lg": "1.5rem", "space-md": "1rem" }, fontFamily: { "title-lg": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "display-lg": ["Inter"], "title-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"] }, fontSize: { "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } }</script><style>
    body {

  </style>
  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface px-margin"><div class="flex flex-col w-full max-w-md mx-auto items-center px-gutter pt-8 pb-12">
<!-- Encabezado con Icono -->
<div class="w-20 h-20 rounded-2xl bg-surface-container flex items-center justify-center mb-6 shadow-sm">
<div class="w-14 h-14 rounded-xl bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl">mail</span>
</div>
</div>
<!-- Títulos y Textos informativos -->
<h1 class="font-headline-md text-headline-md text-primary text-center tracking-tight mb-3">
    Verifica tu correo
  </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-xs mb-8">Te enviamos un enlace de verificación a <span class="font-label-lg text-headline-sm text-primary font-semibold block mt-1">u***@universidad.edu.co</span></p>
<!-- 6 Casillas de Código Numérico -->
<div class="w-full bg-surface-container-low rounded-2xl p-5 mb-8 border border-secondary-fixed flex flex-col gap-3.5 shadow-sm text-left"><div class="flex items-start gap-3"><div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 text-white font-label-md text-label-md font-semibold">1</div><p class="font-body-md text-body-md text-on-surface pt-0.5"><span class="font-semibold text-primary">Abre</span> tu correo institucional</p></div><div class="flex items-start gap-3"><div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 text-white font-label-md text-label-md font-semibold">2</div><p class="font-body-md text-body-md text-on-surface pt-0.5"><span class="font-semibold text-primary">Toca</span> el enlace de verificación</p></div><div class="flex items-start gap-3"><div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 text-white font-label-md text-label-md font-semibold">3</div><p class="font-body-md text-body-md text-on-surface pt-0.5"><span class="font-semibold text-primary">Vuelve a Asistly</span> y continúa</p></div></div>
<!-- Temporizador de reenvío -->

<!-- Botón Principal -->
<button class="w-full h-14 rounded-2xl bg-tertiary-fixed-dim text-primary font-label-lg text-label-lg flex items-center justify-center shadow-md active:opacity-90 active:scale-[0.99] transition-all mb-6" id="verify-btn" type="button" style="opacity: 0;">Ya verifiqué mi correo</button><div class="flex items-center justify-center gap-1.5 text-on-surface-variant font-body-md text-sm"><span class="material-symbols-outlined text-sm">schedule</span><span id="countdown-label" class="">Reenviar correo · disponible en <span class="font-semibold text-primary" id="countdown-timer">00:42</span></span></div>
</div>
<script>
  (function() {
    const inputs = document.querySelectorAll('[data-otp-index]');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
      
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
        pasted.split('').slice(0, 6).forEach((char, i) => {
          if (inputs[i]) inputs[i].value = char;
        });
        const nextIndex = Math.min(pasted.length, inputs.length - 1);
        inputs[nextIndex].focus();
      });
    });

    let seconds = 45;
    const timerElem = document.getElementById('countdown-timer');
    if (timerElem) {
      const interval = setInterval(() => {
        seconds--;
        if (seconds < 0) {
          clearInterval(interval);
          const label = document.getElementById('countdown-label');
          if (label) {
            label.innerHTML = '<span class="text-primary font-semibold cursor-pointer underline">Reenviar c&oacute;digo ahora</span>';
          }
          return;
        }
        const formatted = seconds < 10 ? '0' + seconds : seconds;
        timerElem.textContent = '00:' + formatted;
      }, 1000);
    }
  })();
</script></main>

</body></html>
