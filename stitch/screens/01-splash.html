<script>
  (function initSplashScreen() {
    const statuses = [
      { text: "Iniciando servicios de baliza BLE...", progress: 28 },
      { text: "Detectando aula y baliza de asistencia...", progress: 64 },
      { text: "Comprobando horario de clase...", progress: 88 },
      { text: "Conexión segura establecida", progress: 100 }
    ];

    let step = 0;
    const labelElem = document.getElementById("splash-status-text");
    const percentElem = document.getElementById("splash-percentage");
    const barElem = document.getElementById("splash-progress-bar");

    const interval = setInterval(() => {
      step++;
      if (step < statuses.length) {
        if (labelElem && percentElem && barElem) {
          labelElem.textContent = statuses[step].text;
          percentElem.textContent = statuses[step].progress + "%";
          barElem.style.width = statuses[step].progress + "%";
        }
      } else {
        clearInterval(interval);
      }
    }, 900);
  })();
