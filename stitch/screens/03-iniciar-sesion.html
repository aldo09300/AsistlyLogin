  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface px-margin"><div class="flex flex-col w-full pb-8">
<div class="flex items-center justify-between pt-2 pb-4">
<button aria-label="Volver atrás" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-primary-container">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-md text-label-md font-semibold text-primary-container">Estudiante</span>
</div>
</div>
<div class="relative w-full rounded-2xl overflow-hidden shadow-sm my-2 h-44 bg-surface-container flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="Modern university campus corridor with young students carrying notebooks and digital tablets, sunlit architectural glass windows, warm ambient educational lighting, clean contemporary academic vibe, photorealistic, cinematic shot" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZi8631ZeARCFff-IYntr2W0Vb6HQI44Cmhe4lCb8tPaIyVRHrpe1pgo0cfsO5CMIpY-lPhJSCluAABybL6nO95hOcHQZOyf57SdpHfiQQ6xim8ymBPi9gUkn9qW5Ti4HQejAoAl94jxn7K6AL33IJSXXfUcA9thvdoCfloErB171cM-woTtQ-5JKFfNnI48IX0fhFo-myDVozm7lFHZbOo_OOkJo8yLfUn1v8c0wGnEWLMzl_BWJYsg">
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 via-primary/30 to-transparent"></div>
<div class="absolute bottom-3 left-4 right-4 flex items-center justify-between text-on-primary">
<div>
<p class="font-label-sm text-label-sm uppercase tracking-wider text-tertiary-fixed font-medium">Control de Asistencia</p>
<p class="font-title-md text-title-md text-surface font-semibold">Campus Digital</p>
</div>
<div class="w-9 h-9 rounded-full bg-surface-container-lowest/20 backdrop-blur-sm flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
</div>
</div>
</div>
<div class="mt-4 mb-6">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Iniciar sesión</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Ingresa tus credenciales oficiales para registrar tu asistencia hoy.</p>
</div>
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-primary font-medium flex items-center gap-1" for="correo-institucional">
<span>Correo institucional</span>
<span class="text-tertiary-container font-bold">*</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-on-surface-variant pointer-events-none">alternate_email</span>
<input autocomplete="email" class="w-full h-[52px] pl-11 pr-4 bg-surface-container text-on-surface placeholder:text-outline rounded-xl font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-all shadow-sm" id="correo-institucional" placeholder="ejemplo@universidad.edu" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-primary font-medium flex items-center gap-1" for="contrasena">
<span>Contraseña</span>
<span class="text-tertiary-container font-bold">*</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-on-surface-variant pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full h-[52px] pl-11 pr-12 bg-surface-container text-on-surface placeholder:text-outline rounded-xl font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-all shadow-sm" id="contrasena" placeholder="Ingresa tu clave de acceso" required="" type="password">
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-variant active:text-primary transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end pt-1">
<a class="font-label-lg text-label-lg text-primary-container font-semibold hover:underline active:opacity-75 transition-opacity" href="#">
        ¿Olvidaste tu contraseña?
      </a>
</div>
<div class="pt-4">
<button class="w-full h-[52px] rounded-xl font-label-lg text-label-lg bg-tertiary-fixed-dim text-on-tertiary-fixed font-bold shadow-md hover:brightness-105 active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
</form>
<div class="mt-8 pt-4 flex items-center justify-center text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      ¿No tienes cuenta? 
      <a class="font-label-lg text-label-lg text-primary-container font-bold hover:underline ml-1" href="#">
        Regístrate
      </a>
</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('contrasena');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
