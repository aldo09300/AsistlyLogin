<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

, "secondary": "#4a5d91", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-tablet": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "margin": "1rem", "space-sm": "0.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem", "space-lg": "1.5rem", "space-md": "1rem" }, fontFamily: { "title-lg": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "display-lg": ["Inter"], "title-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"] }, fontSize: { "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface px-margin"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col items-center pt-6 pb-8">
<div class="flex items-center gap-2 mb-8">
<div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1; font-size: 24px;">school</span>
</div>
<span class="font-title-lg text-title-lg font-bold text-primary tracking-tight">Asistly</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary text-center px-4">
      ¿Cómo vas a usar Asistly?
    </h1>
</div>
<div class="flex flex-col gap-4 w-full">
<!-- Opción Docente -->
<button class="role-card relative flex items-start gap-4 p-5 rounded-[16px] text-left transition-all duration-200 outline-none bg-primary-fixed shadow-md" id="role-docente" onclick="selectRole('docente')" type="button" style="outline: rgb(26, 61, 143) solid 2px; outline-offset: -2px;">
<div class="role-icon-box w-12 h-12 rounded-xl flex items-center justify-center shrink-0 text-primary transition-colors bg-surface-container-lowest">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 26px;">assignment_ind</span>
</div>
<div class="flex flex-col flex-1 pr-6 min-w-0">
<span class="font-title-md text-title-md text-primary mb-1">Soy docente</span>
<span class="font-body-md text-body-md text-on-surface-variant">Crea clases y controla la asistencia</span>
</div>
<div class="role-indicator absolute top-5 right-5 w-6 h-6 rounded-full flex items-center justify-center transition-colors bg-primary-container">
<span class="material-symbols-outlined text-surface text-[16px] transition-opacity font-bold opacity-100">check</span>
</div>
</button>
<!-- Opción Estudiante -->
<button class="role-card relative flex items-start gap-4 p-5 rounded-[16px] text-left transition-all duration-200 outline-none bg-surface-container-low shadow-sm" id="role-estudiante" onclick="selectRole('estudiante')" type="button" style="outline: none;">
<div class="role-icon-box w-12 h-12 rounded-xl bg-surface flex items-center justify-center shrink-0 text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 26px;">person_outline</span>
</div>
<div class="flex flex-col flex-1 pr-6 min-w-0">
<span class="font-title-md text-title-md text-primary mb-1">Soy estudiante</span>
<span class="font-body-md text-body-md text-on-surface-variant">Registra tu asistencia en clase</span>
</div>
<div class="role-indicator absolute top-5 right-5 w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-surface opacity-0 text-[16px] transition-opacity font-bold">check</span>
</div>
</button>
</div>
<div class="mt-12 flex flex-col items-center gap-5 w-full">
<button class="w-full h-[52px] rounded-xl bg-tertiary-fixed-dim text-primary font-label-lg text-label-lg font-bold flex items-center justify-center shadow-sm active:scale-[0.99] transition-transform" id="btn-submit" type="button">
      Continuar
    </button>

</div>
</div>
<script>
  let currentRole = 'docente';

  function selectRole(role) {
    currentRole = role;
    
    const cardDocente = document.getElementById('role-docente');
    const cardEstudiante = document.getElementById('role-estudiante');
    
    if (role === 'docente') {
      applySelectedState(cardDocente);
      applyUnselectedState(cardEstudiante);
    } else {
      applySelectedState(cardEstudiante);
      applyUnselectedState(cardDocente);
    }
  }

  function applySelectedState(card) {
    card.classList.remove('bg-surface-container-low', 'shadow-sm');
    card.classList.add('bg-primary-fixed', 'shadow-md');
    card.style.outline = '2px solid #1a3d8f';
    card.style.outlineOffset = '-2px';
    
    const iconBox = card.querySelector('.role-icon-box');
    iconBox.classList.remove('bg-surface');
    iconBox.classList.add('bg-surface-container-lowest', 'text-primary');

    const indicator = card.querySelector('.role-indicator');
    indicator.classList.remove('bg-surface-container-highest');
    indicator.classList.add('bg-primary-container');
    const check = indicator.querySelector('span');
    check.classList.remove('opacity-0');
    check.classList.add('opacity-100');
  }

  function applyUnselectedState(card) {
    card.classList.add('bg-surface-container-low', 'shadow-sm');
    card.classList.remove('bg-primary-fixed', 'shadow-md');
    card.style.outline = 'none';
    
    const iconBox = card.querySelector('.role-icon-box');
    iconBox.classList.add('bg-surface');
    iconBox.classList.remove('bg-surface-container-lowest');

    const indicator = card.querySelector('.role-indicator');
    indicator.classList.add('bg-surface-container-highest');
    indicator.classList.remove('bg-primary-container');
    const check = indicator.querySelector('span');
    check.classList.add('opacity-0');
    check.classList.remove('opacity-100');
  }

  document.addEventListener('DOMContentLoaded', () => {
    selectRole('docente');
  });
  if (document.readyState !== 'loading') {
    selectRole('docente');
  }
</script></main>

</body></html>
