<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

, "secondary": "#4a5d91", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-tablet": "1.5rem", "space-xs": "0.25rem", "gutter": "1rem", "margin": "1rem", "space-sm": "0.5rem", "space-xl": "2rem", "gutter-sm": "0.75rem", "space-lg": "1.5rem", "space-md": "1rem" }, fontFamily: { "title-lg": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "display-lg": ["Inter"], "title-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"] }, fontSize: { "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }] } } } }</script><style>
    body {

  </head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface px-margin"><div class="flex flex-col w-full pb-8">
<div class="flex items-center gap-3 pt-2 pb-4">
<button aria-label="Volver" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-title-lg">arrow_back</span>
</button>

</div>
<div class="mb-5">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Crear cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Ingresa tus datos institucionales para crear tu cuenta.</p>
</div>
<div class="w-full bg-secondary-fixed/50 text-primary p-4 rounded-2xl mb-6 shadow-sm flex items-start gap-3.5">
<div class="w-9 h-9 rounded-xl bg-primary-container/15 flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">phonelink_lock</span>
</div>
<div class="flex-1">
<p class="font-title-md text-title-md text-primary font-semibold mb-0.5">Dispositivo seguro</p>
<p class="font-body-sm text-body-sm text-on-secondary-fixed-variant leading-relaxed">Tu cuenta quedará vinculada a este dispositivo. Solo podrás registrar asistencia desde este celular.</p>
</div>
</div>
<form class="flex flex-col gap-4" id="register-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="fullname">
<span class="">Nombre completo</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-title-lg pointer-events-none">person</span>
<input class="w-full h-13 pl-11 pr-4 py-3 bg-surface-container rounded-2xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all duration-200" id="fullname" placeholder="Ej. Valeria Gómez Morales" required="" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="student-code">
<span class="">Código estudiantil</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-title-lg pointer-events-none">badge</span>
<input class="w-full h-13 pl-11 pr-4 py-3 bg-surface-container rounded-2xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all duration-200" id="student-code" placeholder="Ej. 2024-10842" required="" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="student-email">
<span class="">Correo institucional</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-title-lg pointer-events-none">mail</span>
<input class="w-full h-13 pl-11 pr-4 py-3 bg-surface-container rounded-2xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all duration-200" id="student-email" placeholder="nombre.apellido@universidad.edu" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="password">
<span class="">Contraseña</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-title-lg pointer-events-none">lock</span>
<input class="w-full h-13 pl-11 pr-12 py-3 bg-surface-container rounded-2xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all duration-200" id="password" placeholder="Mínimo 8 caracteres" required="" type="password">
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-3 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface active:bg-surface-variant transition-colors" id="toggle-pwd" onclick="const p = document.getElementById('password'); const icon = this.querySelector('span'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility_off'; } else { p.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-title-lg">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-lg text-label-lg text-on-surface flex items-center gap-1.5" for="confirm-password">
<span class="">Confirmar contraseña</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-title-lg pointer-events-none">lock_reset</span>
<input class="w-full h-13 pl-11 pr-12 py-3 bg-surface-container rounded-2xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all duration-200" id="confirm-password" placeholder="Repite tu contraseña" required="" type="password">
<button aria-label="Alternar visibilidad de confirmación" class="absolute right-3 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface active:bg-surface-variant transition-colors" id="toggle-confirm-pwd" onclick="const p = document.getElementById('confirm-password'); const icon = this.querySelector('span'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility_off'; } else { p.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-title-lg">visibility</span>
</button>
</div>
</div>
<div class="pt-2 pb-1">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center mt-0.5">
<input class="peer sr-only" id="terms-checkbox" required="" type="checkbox">
<div class="w-6 h-6 rounded-lg bg-surface-container peer-checked:bg-primary-container transition-all flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-on-primary text-title-md opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-snug group-hover:text-on-surface transition-colors">
          Acepto los términos y el tratamiento de datos
        </span>
</label>
</div>
<button class="w-full h-13 mt-2 bg-tertiary-fixed-dim hover:bg-tertiary-fixed text-primary font-label-lg text-label-lg rounded-2xl shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="submit">
<span class="">Registrarme</span>
<span class="material-symbols-outlined text-title-lg">arrow_forward</span>
</button>
</form>
</div></main>

</body></html>
